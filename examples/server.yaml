# Paths are relative to this file. Fill in your SSH account and client key fingerprint.
# Optional whitelist.yaml and blacklist.yaml are loaded from this directory.
listen: 127.0.0.1:2222
# verbose_review_logs: true  # Provider diagnostics and Ollama curl replay; includes commands/history.
# log_commands: true  # Include plaintext commands in JSON logs.
# accept_all_keys: true  # Lab client/backend key discovery; keep user mappings below.
# metrics_listen: 127.0.0.1:2112  # Optional Prometheus /metrics endpoint.
backend: 127.0.0.1:22
backend_key: backend_key
known_hosts: known_hosts
authorized_keys: authorized_keys
users:
  alice:
    backend_user: alice
    fingerprints:
      - SHA256:REPLACE_WITH_CLIENT_KEY_FINGERPRINT
