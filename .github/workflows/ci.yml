name: CI and container

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    name: CI
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.changes.outputs.build_needed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Find image input changes
        id: changes
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' > "$RUNNER_TEMP/changed-paths"
          build_needed=false
          # The API lists at most 3,000 files. Build if the PR exceeds that limit.
          if [[ ! "$CHANGED_FILES" =~ ^[0-9]+$ ]] || (( 10#$CHANGED_FILES > 3000 )); then
            build_needed=true
          fi
          while IFS= read -r path; do
            case "$path" in
              Containerfile|.containerignore|.dockerignore|go.mod|go.sum|cmd/*|examples/*)
                build_needed=true
                break
                ;;
            esac
          done < "$RUNNER_TEMP/changed-paths"
          echo "build_needed=$build_needed" >> "$GITHUB_OUTPUT"

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan commits for secrets
        env:
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push)
              if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                gitleaks git --redact --no-banner --log-opts="$BEFORE..$HEAD"
              else
                gitleaks git --redact --no-banner --log-opts="$HEAD"
              fi
              ;;
            pull_request)
              gitleaks git --redact --no-banner --log-opts="$BASE_SHA..$PR_HEAD_SHA"
              ;;
            pull_request_target)
              gitleaks git --redact --no-banner --log-opts="$(git rev-parse HEAD)"
              ;;
          esac

      - name: Make source snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source"

      - name: Scan source dependencies
        uses: anchore/scan-action@v7
        with:
          path: ${{ runner.temp }}/source
          fail-build: true
          severity-cutoff: high

      - name: Test
        working-directory: ${{ runner.temp }}/source
        env:
          GOWORK: off
        run: go test -mod=readonly -count=1 ./...

      - name: Vet
        working-directory: ${{ runner.temp }}/source
        env:
          GOWORK: off
        run: go vet -mod=readonly ./...

  publish:
    name: Container build
    needs: checks
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && needs.checks.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            dlotterman/ssh-ballpit:latest
            dlotterman/ssh-ballpit:sha-${{ github.event.pull_request.merge_commit_sha }}
